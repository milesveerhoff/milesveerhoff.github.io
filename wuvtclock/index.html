<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WUVT Studio Clock</title>
    <link id="favicon" rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgo=">
    
    <style>
        :root {
            /* --- PALETTE: WUVT (Derived from wuvt.css) --- */
            --wuvt-bg: #cfeeff;          
            --wuvt-card: rgba(255,255,255,0.72); 
            --wuvt-border: #BCCCD3;      
            
            --wuvt-text: #000000;
            --wuvt-dim: #666666;
            
            /* Alert Colors (Backgrounds) */
            --status-green-bg: #e8f5e9;
            --status-yellow-bg: #fffde7;
            --status-red-bg: #ffebee;
            
            /* Alert Colors (Borders) */
            --status-green-border: #4CAF50;
            --status-yellow-border: #FFC107;
            --status-red-border: #ec1c23; 

            --speed: 0.5s; 
        }

        body {
            background-color: var(--wuvt-bg);
            background-image: linear-gradient(to bottom, #cfeeff 0%, #cfeeff 100%);
            color: var(--wuvt-text);
            font-family: Helvetica, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            flex-direction: column;
        }

        #wrapper {
            width: 90%;
            max-width: 900px;
            text-align: center;
            background-color: var(--wuvt-card);
            border: 5px solid var(--wuvt-border);
            padding: 30px;
            margin-bottom: 50px;
            position: relative;
        }

        /* --- CLOCK STYLES --- */
        #clock-wrap {
            display: flex;
            align-items: baseline;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--wuvt-border);
        }

        #current-time {
            font-size: clamp(4rem, 15vw, 10rem);
            font-weight: 700;
            letter-spacing: -3px;
            line-height: 1;
            color: #222;
        }

        #ampm {
            font-size: clamp(1rem, 3vw, 2rem);
            color: var(--wuvt-dim);
            margin-left: 10px;
            text-transform: uppercase;
            font-weight: bold;
        }

        /* --- ALERT BOX --- */
        #ui-container {
            position: relative;
            background: #fff;
            border: 1px solid var(--wuvt-border);
            border-left: 10px solid var(--wuvt-border);
            margin: 0 auto;
            width: 95%;
            opacity: 0;
            visibility: hidden;
            height: 0;
            overflow: hidden;
            transition: all 0.3s ease;
            text-align: left;
        }

        body.alert-active #ui-container {
            opacity: 1;
            visibility: visible;
            height: auto;
            padding: 1.5rem;
            margin: 0 auto 2rem auto;
        }

        /* Allow manual dismissal to hide the alert container */
        body.manual-hide #ui-container {
            opacity: 0 !important;
            visibility: hidden !important;
            height: 0 !important;
            padding: 0 !important;
            margin: 0 !important;
            overflow: hidden !important;
        }

        /* Alert Color Phases */
        body.green-phase #ui-container { 
            background-color: var(--status-green-bg); 
            border-left-color: var(--status-green-border); 
        }
        body.yellow-phase #ui-container { 
            background-color: var(--status-yellow-bg); 
            border-left-color: var(--status-yellow-border); 
        }
        body.red-phase #ui-container { 
            background-color: var(--status-red-bg); 
            border-left-color: var(--status-red-border); 
        }

        #hide-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: transparent;
            border: none;
            color: #999;
            width: 30px;
            height: 30px;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: bold;
        }
        #hide-btn:hover { color: var(--status-red-border); }

        #message { 
            font-size: clamp(1.5rem, 4vw, 2.2rem); 
            font-weight: 700; 
            margin-bottom: 0.25rem; 
            line-height: 1.1;
            color: #000;
        }
        
        #status-text { 
            font-size: 0.9rem; 
            color: #555;
            margin-bottom: 10px;
        }
        
        #countdown { 
            font-size: clamp(1.5rem, 4vw, 2rem); 
            font-weight: 700; 
            font-variant-numeric: tabular-nums; 
            color: #333;
        }

        #reminder {
            font-size: 1rem;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px dashed #ccc;
            font-style: italic;
            color: #333;
            font-weight: bold;
        }

        /* --- TIMELINE --- */
        .timeline {
            display: flex;
            justify-content: center;
            gap: 0;
            padding-top: 0;
            width: 100%;
            border: 1px solid #fff;
        }

        .timeline-item {
            flex: 1;
            min-width: 0;
            background: #c5d5dc;
            padding: 15px;
            border: 1px solid white;
        }
        
        .timeline-item:last-child {
            background: rgba(197, 213, 220, 0.5); 
        }

        .timeline-label { 
            display: block; 
            color: var(--wuvt-dim); 
            font-size: 0.8rem; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            margin-bottom: 8px; 
        }
        
        .timeline-value { 
            font-size: 1.1rem; 
            font-weight: 500;
            white-space: nowrap; 
            color: #000;
        }

        /* --- DEBUG PANEL --- */
        #settings-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--wuvt-border);
            color: #fff;
            border: none;
            border-radius: 4px;
            width: 40px;
            height: 40px;
            cursor: pointer;
            font-size: 20px;
            z-index: 1000;
            opacity: 0.0;
            transition: opacity 0.0s;
        }
        #settings-toggle:hover { opacity: 1; }

        #debug-controls {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #333;
            color: #fff;
            padding: 20px;
            box-sizing: border-box;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 999;
            text-align: center;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        #debug-controls.visible { transform: translateY(0); }
        #debug-controls input { background: #555; border: 1px solid #777; color: white; padding: 4px; }

        /* --- MOBILE --- */
        @media (max-width: 768px) {
            #wrapper { width: 95%; padding: 15px; }
            .timeline { flex-direction: column; gap: 10px; }
            .timeline-item { width: auto; border: 1px solid #fff; }
            .timeline-value { white-space: normal; }
            #ui-container { width: 100%; box-sizing: border-box; }
        }
    </style>
</head>
<body id="monitor-body">

<div id="wrapper">
    <div id="clock-wrap">
        <span id="current-time">12:00:00</span>
        <span id="ampm">PM</span>
    </div>

    <div id="ui-container">
        <button id="hide-btn" onclick="dismissTask()" aria-label="Dismiss Alert">✕</button>
        <div id="message">task</div>
        <div id="countdown">00:00</div>
        <div id="status-text">--</div>
        <div id="reminder"></div>
    </div>

    <div class="timeline">
        <div class="timeline-item">
            <span class="timeline-label">Previous</span>
            <div id="last-event" class="timeline-value">--</div>
        </div>
        <div class="timeline-item">
            <span class="timeline-label">Upcoming</span>
            <div id="next-event" class="timeline-value">--</div>
        </div>
    </div>
</div>

<button id="settings-toggle" onclick="toggleDebugPanel()" aria-label="Toggle Simulation">⚙️</button>

<div id="debug-controls">
    <strong>DEBUG:</strong>
    <label>
        <input type="checkbox" id="sim-active" onchange="toggleSim()"> Enable Sim
    </label>
    <label>
        Hour: <input type="number" id="sim-hour" value="23" min="0" max="23" style="width: 50px;">
    </label>
    <label>
        Minute: 
        <input type="range" id="sim-min" value="58" min="0" max="59" oninput="updateSimDisplay()">
        <span id="sim-min-val" style="width: 2ch; display: inline-block;">58</span>
    </label>
</div>

<script>
    const targets = [
        { mark: 0, text: "Read Legal ID / Underwriting", reminder: "You are listening to WUVT-FM 90.7 Blacksburg (and 101.9 Roanoke)" },
        { mark: 15, text: "Read PSA", reminder: "" },
        { mark: 30, text: "Read Promo / Underwriting", reminder: "Reminder to take calls! (540) 231-9888" },
        { mark: 45, text: "Read PSA", reminder: "" }
    ];

    let currentActiveTargetMark = null;
    let isManuallyDismissed = false;
    let simActive = false;
    
    // Track current phase to update favicon only on change
    let currentFaviconPhase = 'default'; 

    function setFavicon(color, date = new Date()) {
        const canvas = document.createElement('canvas');
        canvas.width = 64;
        canvas.height = 64;
        const ctx = canvas.getContext('2d');

        const cx = 32, cy = 32;

        // 1. Draw Background Circle
        ctx.beginPath();
        ctx.arc(cx, cy, 30, 0, 2 * Math.PI, false);
        ctx.fillStyle = color;
        ctx.fill();
        
        // 2. Draw Border (Darker for visibility)
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#555';
        ctx.stroke();

        // 3. Draw Hands based on provided time
        const hours = date.getHours();
        const minutes = date.getMinutes();
        const seconds = date.getSeconds();

        // Compute angles (degrees where 0 = 12 o'clock)
        const hourDeg = ((hours % 12) + minutes / 60) * 30; // 360/12
        const minuteDeg = (minutes + seconds / 60) * 6; // 360/60

        const hourRad = (hourDeg - 90) * Math.PI / 180;
        const minuteRad = (minuteDeg - 90) * Math.PI / 180;

        // Hour hand
        ctx.beginPath();
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#333';
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(hourRad) * 12, cy + Math.sin(hourRad) * 12);
        ctx.stroke();

        // Minute hand
        ctx.beginPath();
        ctx.lineWidth = 3;
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(minuteRad) * 18, cy + Math.sin(minuteRad) * 18);
        ctx.stroke();

        // 4. Draw Center Dot
        ctx.beginPath();
        ctx.arc(cx, cy, 3, 0, 2 * Math.PI, false);
        ctx.fillStyle = '#333';
        ctx.fill();

        const link = document.getElementById('favicon');
        link.href = canvas.toDataURL("image/png");
    }

    // Initialize default White favicon using current time
    setFavicon('#ffffff', new Date());

    function dismissTask() {
        document.getElementById('monitor-body').classList.add('manual-hide');
        isManuallyDismissed = true;
    }

    function toggleDebugPanel() {
        document.getElementById('debug-controls').classList.toggle('visible');
    }

    function toggleSim() {
        simActive = document.getElementById('sim-active').checked;
        isManuallyDismissed = false; 
    }

    function updateSimDisplay() {
        document.getElementById('sim-min-val').textContent = document.getElementById('sim-min').value;
    }

    function formatTime(date) {
        let h = date.getHours();
        let m = String(date.getMinutes()).padStart(2, '0');
        let period = h >= 12 ? 'PM' : 'AM';
        let h12 = h % 12 || 12; 
        return `${String(h12).padStart(2, '0')}:${m} ${period}`;
    }

    function getTaskText(target, date) {
        if (target.mark === 0 && date.getHours() === 0) {
            return "Read Statement of Ownership";
        }
        return target.text;
    }

    function update() {
        // --- TIME SIMULATION ---
        let now = new Date();
        if (simActive) {
            const h = parseInt(document.getElementById('sim-hour').value) || 0;
            const m = parseInt(document.getElementById('sim-min').value) || 0;
            now.setHours(h);
            now.setMinutes(m);
            now.setSeconds(30); 
        }

        const m = now.getMinutes();
        const s = now.getSeconds();

        // 1. Update Main Clock
        const h12 = now.getHours() % 12 || 12;
        const ampm = now.getHours() >= 12 ? 'PM' : 'AM';
        document.getElementById('current-time').textContent = 
            `${String(h12).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        document.getElementById('ampm').textContent = ampm;

        // 2. Determine Active Window
        let active = null;
        let diff = 0;
        for (let t of targets) {
            let d = m - t.mark;
            if (t.mark === 0 && m >= 54) d = m - 60;
            if (t.mark === 0 && m <= 6) d = m;
            
            if (d >= -6 && d < 6) { 
                active = t; 
                diff = d; 
                break; 
            }
        }

        const body = document.getElementById('monitor-body');
        let newPhase = 'default';

        // 3. Reset manual-hide and track target change
        if (active) {
            if (currentActiveTargetMark !== active.mark) {
                isManuallyDismissed = false;
                body.classList.remove('manual-hide');
                currentActiveTargetMark = active.mark;
            }
        } else {
            body.classList.remove('alert-active', 'manual-hide', 'green-phase', 'yellow-phase', 'red-phase');
            isManuallyDismissed = false;
            currentActiveTargetMark = null;
        }

        // 4. Timeline Calculation
        let lastIdx = targets.findIndex(t => t.mark > m) - 1;
        if (lastIdx === -2) lastIdx = targets.length - 1; 
        
        let prevDate = new Date(now.getTime());
        prevDate.setMinutes(targets[lastIdx].mark);
        prevDate.setSeconds(0);
        if (targets[lastIdx].mark > m) prevDate.setHours(now.getHours() - 1);

        let nextIdx = targets.findIndex(t => t.mark > m);
        if (nextIdx === -1) nextIdx = 0;
        
        let nextDate = new Date(now.getTime());
        nextDate.setMinutes(targets[nextIdx].mark);
        nextDate.setSeconds(0);
        if (targets[nextIdx].mark <= m) nextDate.setHours(now.getHours() + 1);

        document.getElementById('last-event').textContent = `${getTaskText(targets[lastIdx], prevDate)} (${formatTime(prevDate)})`;
        document.getElementById('next-event').textContent = `${getTaskText(targets[nextIdx], nextDate)} (${formatTime(nextDate)})`;

        // 5. Render Action Card & Determine Phase
        if (active && !isManuallyDismissed) {
            body.classList.add('alert-active');
            
            let targetDate = new Date(now.getTime());
            targetDate.setMinutes(active.mark);
            targetDate.setSeconds(0);
            if (active.mark === 0 && m >= 54) targetDate.setHours(now.getHours() + 1);

            document.getElementById('message').textContent = getTaskText(active, targetDate);
            document.getElementById('reminder').textContent = active.reminder || '';

            if (diff < 0) {
                const secsLeft = (Math.abs(diff) * 60) - s;
                body.classList.remove('red-phase');
                
                if (secsLeft < 60) {
                    body.classList.add('yellow-phase');
                    body.classList.remove('green-phase');
                    newPhase = 'yellow';
                } else {
                    body.classList.add('green-phase');
                    body.classList.remove('yellow-phase');
                    newPhase = 'green';
                }
                
                document.getElementById('status-text').textContent = `Target: ${formatTime(targetDate)}`;
                document.getElementById('countdown').textContent = `${Math.floor(secsLeft/60)}:${String(secsLeft%60).padStart(2,'0')} until start`;
            } else {
                body.classList.remove('green-phase', 'yellow-phase');
                body.classList.add('red-phase');
                newPhase = 'red';
                
                let graceDate = new Date(now.getTime());
                graceDate.setMinutes(active.mark + 6);
                graceDate.setSeconds(0);
                
                document.getElementById('status-text').textContent = `Grace period ends ${formatTime(graceDate)}`;
                const secsLeft = (6 - diff) * 60 - s;
                document.getElementById('countdown').textContent = `${Math.floor(secsLeft/60)}:${String(secsLeft%60).padStart(2,'0')} left`;
            }
        }

        // 6. Update Favicon if phase changed
        if (newPhase !== currentFaviconPhase) {
            currentFaviconPhase = newPhase;
            // USING LIGHTER PASTEL COLORS FOR ICON
            if (newPhase === 'green') setFavicon('#A5D6A7', now);       // Pastel Green
            else if (newPhase === 'yellow') setFavicon('#FFF59D', now); // Pastel Yellow
            else if (newPhase === 'red') setFavicon('#EF9A9A', now);    // Pastel Red
            else setFavicon('#ffffff', now);                            // White (Default)
        }
    }

    setInterval(update, 100); 
    update();
</script>
</body>
</html>
